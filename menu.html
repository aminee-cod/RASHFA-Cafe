<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Our Menu | RASHFA</title>
<meta name="theme-color" content="#F6E2C4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <button class="nav-close-btn" id="navCloseBtn"><i class="fas fa-times"></i></button>
    <a href="index.html" class="brand">
      <span class="brand-icon"><i class="fas fa-mug-hot"></i></span>
      <span class="brand-name">RASH<em>FA</em></span>
    </a>
    <nav class="side-nav">
      <a href="index.html" class="side-link"><i class="fas fa-house"></i><span>Home page</span></a>
      <a href="menu.html" class="side-link active"><i class="fas fa-utensils"></i><span>Menu</span></a>
      <a href="cart.html" class="side-link"><i class="fas fa-bag-shopping"></i><span>My Cart</span><span class="side-badge cart-count">0</span></a>
      <a href="reservations.html" class="side-link"><i class="fas fa-calendar-check"></i><span>Reservations</span></a>
      <a href="reviews.html" class="side-link"><i class="fas fa-star"></i><span>Reviews</span></a>
    </nav>
    <div class="sidebar-bottom">
      <a href="tel:+213555000000" class="side-link"><i class="fas fa-phone"></i><span>Contact us</span></a>
      <div class="side-social">
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
      </div>
    </div>
  </aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <div class="topbar">
      <button class="topbar-mobile-btn" id="navOpenBtn" aria-label="Open menu"><i class="fas fa-bars"></i></button>
      <div class="search-bar">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search the menu...">
      </div>
      <a href="cart.html" class="btn-cart-icon"><i class="fas fa-bag-shopping"></i><span class="cart-count">0</span></a>
    </div>

    <div class="page-head">
      <h1>Coffee &amp; food menu</h1>
      <p>Choose a category, pick your favorite, and customize it your way.</p>
    </div>

    <div class="pill-tabs" id="categoryTabs"></div>

    <div class="product-grid" id="productGrid"></div>
  </main>
</div>

<!-- ===== CUSTOMIZE MODAL ===== -->
<div class="custom-modal" id="customModal">
  <div class="custom-modal-content">
    <div class="modal-head">
      <h2><i class="fas fa-edit"></i> Customize order</h2>
      <button class="close-modal-btn" id="closeCustomModal"><i class="fas fa-times"></i></button>
    </div>
    <div class="product-preview">
      <img id="modalProductImage" src="" alt="">
      <div>
        <h3 id="modalProductName">Product name</h3>
        <div class="price"><span id="modalProductPrice">0</span> DZD</div>
      </div>
    </div>
    <div class="form-group">
      <label><i class="fas fa-hashtag"></i> Quantity</label>
      <div class="modal-qty-control">
        <button id="qtyMinus">−</button>
        <span id="qtyValue">1</span>
        <button id="qtyPlus">+</button>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label><i class="fas fa-pen"></i> Special notes</label>
      <textarea id="modalNotes" placeholder="e.g. no sugar, extra toppings..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-modal cancel" id="cancelCustom">Cancel</button>
      <button class="btn-modal confirm" id="confirmCustom"><i class="fas fa-check-circle"></i> Add to cart</button>
    </div>
  </div>
</div>

<!-- ===== TOAST & MODAL ===== -->
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon"><i class="fas fa-check-circle"></i></div>
    <h3 id="modalTitle">Confirm</h3>
    <p id="modalMessage">Are you sure you want to proceed?</p>
    <div class="modal-actions">
      <button class="btn-modal cancel" id="modalCancel">Cancel</button>
      <button class="btn-modal confirm" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>

<script src="assets/app.js"></script>
<script>
  // ===== MENU DATA =====
  const menuStructure = {
    crepes: {
      label: 'Crepes', icon: 'fa-bread-slice',
      items: [
        { id: 1, name: 'Chocolate Crepe', price: 300, desc: 'Chocolate, banana, nuts', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBXTjWkZRoWsV8SzAdZ7Gy1LtB6GvcKjzp2rbeJ4sIImiDFzY9FTiVXqY&s=10', badge: 'Best Seller' },
        { id: 2, name: 'Strawberry Crepe', price: 350, desc: 'Strawberry, cream, honey', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4B_vc9wNRG1nUJIEGaj6J-evsJXebFk7DuAYAmF4rKy3BEVVMZXgAOmE&s=10' },
        { id: 3, name: 'Nutella Crepe', price: 380, desc: 'Nutella, banana, nuts', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOXsCJIRlsNIhhG4NPdEqA9JXnohILJzknJZZ3mTZ4HA&s=10' }
      ]
    },
    waffles: {
      label: 'Waffles', icon: 'fa-plate-wheat',
      items: [
        { id: 6, name: 'Belgian Waffle', price: 400, desc: 'Waffle, honey, fresh fruits', image: 'https://tastesbetterfromscratch.com/wp-content/uploads/2023/03/Belgian-Waffles26-Thumbnail-1-scaled.jpg' },
        { id: 7, name: 'Chocolate Waffle', price: 450, desc: 'Waffle, chocolate sauce, cream', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYUlTThQNyxZt3fvfEIUqP9Yg3DHPfDkFOM6744EMYjw&s=10', badge: 'Best Seller' },
        { id: 8, name: 'Strawberry Waffle', price: 430, desc: 'Waffle, strawberry, cream', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQKE8x9ZdEjkmg0PVGEjrp-ZZ644IxYatWB9qOqA-_zpcBs-lumuLI2y2Q&s=10' }
      ]
    },
    pancakes: {
      label: 'Pancakes', icon: 'fa-cookie',
      items: [
        { id: 9, name: 'Honey Pancake', price: 320, desc: 'Pancake, honey, butter', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQg5VTdaWXHZyj6WTRUnJ7FzG1oSOLKWe7_-Fz-uNydzA&s=10' },
        { id: 10, name: 'Fruit Pancake', price: 380, desc: 'Pancake, fresh fruits, cream', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1xKFqN_wP1zuNjmyuZeaFtkjs--OAu36PbAmwRoN5WhrHfA5JSrMlGdU&s=10', badge: 'Featured' },
        { id: 11, name: 'Chocolate Pancake', price: 360, desc: 'Pancake, chocolate, nuts', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmhKPRcVgi2ntZonKVr73S5bAadXMKbOxT10UxsTu9aQ&s=10' }
      ]
    },
    drinks: {
      label: 'Drinks', icon: 'fa-glass-water',
      items: [
        { id: 12, name: 'Tropical Mocktail', price: 280, desc: 'Pineapple, coconut, mint', image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400', badge: 'Popular' },
        { id: 13, name: 'Fruit Mocktail', price: 250, desc: 'Mixed fresh fruits', image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400' },
        { id: 14, name: 'Orange Juice', price: 180, desc: 'Fresh orange', image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400' },
        { id: 15, name: 'Pineapple Juice', price: 200, desc: 'Fresh pineapple', image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400' }
      ]
    }
  };

  let currentCategory = 'all';
  const allItemsFlat = Object.keys(menuStructure).flatMap(key => menuStructure[key].items.map(i => ({ ...i, category: key })));

  function renderTabs() {
    const tabs = document.getElementById('categoryTabs');
    const cats = [{ key: 'all', label: 'All', icon: 'fa-border-all' }, ...Object.keys(menuStructure).map(key => ({ key, label: menuStructure[key].label, icon: menuStructure[key].icon }))];
    tabs.innerHTML = cats.map(c => `<button class="pill-tab ${c.key === currentCategory ? 'active' : ''}" onclick="selectCategory('${c.key}')"><i class="fas ${c.icon}"></i> ${c.label}</button>`).join('');
  }

  function selectCategory(key) {
    currentCategory = key;
    renderTabs();
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    let items = currentCategory === 'all' ? allItemsFlat : allItemsFlat.filter(i => i.category === currentCategory);
    if (query) items = items.filter(i => i.name.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query));

    if (items.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon"><i class="fas fa-mug-saucer"></i></div><h3>No items found</h3><p>Try a different search or category</p></div>`;
      return;
    }

    grid.innerHTML = items.map(item => `
      <div class="product-card">
        <div class="thumb" onclick='openCustomModalFromData(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
          <img src="${item.image}" alt="${item.name}" loading="lazy">
          ${item.badge ? `<span class="badge">${item.badge}</span>` : ''}
        </div>
        <div class="row-top"><h3>${item.name}</h3></div>
        <p class="desc">${item.desc}</p>
        <div class="card-footer">
          <span class="price-tag">${item.price} DZD</span>
          <button class="add-cart-btn" style="flex:0 0 auto;padding:11px 18px;" onclick='openCustomModalFromData(${JSON.stringify(item).replace(/'/g, "&#39;")})'><i class="fas fa-bag-shopping"></i> Add</button>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', renderProducts);

  // ===== CUSTOMIZE MODAL =====
  let currentItem = null;
  let currentQuantity = 1;
  const modal = document.getElementById('customModal');

  function openCustomModalFromData(item) {
    currentItem = item;
    currentQuantity = 1;
    document.getElementById('modalNotes').value = '';
    document.getElementById('modalProductImage').src = item.image;
    document.getElementById('modalProductImage').alt = item.name;
    document.getElementById('modalProductName').textContent = item.name;
    document.getElementById('modalProductPrice').textContent = item.price;
    document.getElementById('qtyValue').textContent = '1';
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeCustomModalFn() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
  }

  document.getElementById('qtyMinus').addEventListener('click', () => {
    if (currentQuantity > 1) { currentQuantity--; document.getElementById('qtyValue').textContent = currentQuantity; }
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    if (currentQuantity < 20) { currentQuantity++; document.getElementById('qtyValue').textContent = currentQuantity; }
  });
  document.getElementById('closeCustomModal').addEventListener('click', closeCustomModalFn);
  document.getElementById('cancelCustom').addEventListener('click', closeCustomModalFn);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeCustomModalFn(); });

  document.getElementById('confirmCustom').addEventListener('click', () => {
    if (!currentItem) return;
    const notes = document.getElementById('modalNotes').value.trim();
    let cart = JSON.parse(localStorage.getItem('rashfaCart')) || [];
    cart.push({ ...currentItem, quantity: currentQuantity, notes, cartId: Date.now() + Math.random() * 1000 });
    localStorage.setItem('rashfaCart', JSON.stringify(cart));
    updateCartCount();
    closeCustomModalFn();
    showToast(`"${currentItem.name}" ×${currentQuantity} added to cart`, 'success');
  });

  window.selectCategory = selectCategory;
  window.openCustomModalFromData = openCustomModalFromData;

  renderTabs();
  renderProducts();
</script>
</body>
</html>
